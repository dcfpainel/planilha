name: Atualização Diária Painel PRAD

on:
  schedule:
    # Executa de segunda a sexta-feira às 11:30 UTC (08:30 no Horário de Brasília)
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # Permite acionar manualmente a qualquer momento pelo botão "Run workflow" no GitHub

jobs:
  executar-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar repositório
        uses: actions/checkout@v4

      - name: 2. Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Executar automação (Download -> Tratamento -> Google Sheets)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_IMAP_SERVER: ${{ secrets.EMAIL_IMAP_SERVER || 'imap.gmail.com' }}
          EMAIL_SUBJECT: ${{ secrets.EMAIL_SUBJECT || 'Execução da despesa' }}
        run: |
          python pipeline.py
